name: bugfix
description: Targeted bug fix workflow — diagnose, fix, test, review

steps:
  - id: planner
    required: true

  - id: domain-agent
    required: true

  - id: testing-agent
    required: true

  - id: review-agent
    required: true

retryPolicy:
  attempts: 3

conditions:
  - lint-failure
  - test-failure
  - typecheck-failure
