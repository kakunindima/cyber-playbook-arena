version: 1

project:
  name: cyber-playbook-arena
  type: react-typescript

models:
  planner: claude-opus-4-7
  scaffolder: claude-sonnet-4-6
  reviewer: claude-opus-4-7
  implementation: claude-sonnet-4-6
  testing: claude-sonnet-4-6
  documentation: claude-sonnet-4-6

context:
  include:
    - src/**
    - docs/**
    - .ai/**

memory:
  enabled: true
  path: .ai/memory

workflows:
  path: .ai/workflow

policies:
  path: .ai/policies

quality:
  required:
    - npm run lint
    - npm run typecheck
    - npm run test

permissions:
  filesystem:
    read: true
    write: true
    delete: false

  terminal:
    allowed:
      - npm
      - npx
      - bun
      - bunx
      - git
      - node
